<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat</title><link rel="stylesheet" href="common.css"><script src="/orbit-sdk.js" defer></script><script src="ui.js" defer></script><script src="app.js" defer></script></head><body><header><button id="drag">Chat</button><button id="hide" aria-label="Nascondi">_</button><button id="close" aria-label="Chiudi">×</button></header><div id="error" role="alert" hidden></div><main><div class="row"><select id="sessions" aria-label="Conversazione"></select><button id="new">Nuova chat</button><button id="delete" aria-label="Elimina conversazione">×</button></div><div class="row"><button id="capture">Allega cattura</button><button id="remove" hidden>Rimuovi allegato</button><button id="cancel-capture" hidden>Annulla richiesta</button></div><div id="providers" class="row" aria-label="Fornitori cattura"></div><div id="messages" class="scroll" role="log" aria-label="Messaggi"></div><img id="attachment" alt="Immagine da inviare" hidden><form id="form"><textarea id="message" aria-label="Messaggio" rows="2" maxlength="20000" placeholder="Cosa vuoi sapere?" required></textarea><div class="row"><small class="grow">L'immagine parte solo con Invia.</small><button id="stop" type="button" hidden>Interrompi</button><button id="send" class="primary" type="submit">Invia</button></div></form></main></body></html>
