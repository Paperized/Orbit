<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timer</title><link rel="stylesheet" href="common.css"><script src="/orbit-sdk.js" defer></script><script src="ui.js" defer></script><script src="app.js" defer></script></head><body><header><button id="drag">Timer</button><button id="hide" aria-label="Nascondi">_</button><button id="close" aria-label="Chiudi">×</button></header><div id="error" role="alert" hidden></div><main><h1>Un promemoria, al momento giusto.</h1><form id="form"><p class="row"><input id="label" aria-label="Nome timer" maxlength="120" placeholder="Pausa" value="Pausa"></p><p class="row"><input id="seconds" aria-label="Secondi" type="number" min="1" max="86400" value="300"><button class="primary" type="submit">Avvia</button></p></form><small>Puoi chiudere la finestra: Orbit conserva la scadenza. Se esci da Orbit, la riprende al prossimo avvio.</small><div id="timers" class="scroll" role="list"></div></main></body></html>
