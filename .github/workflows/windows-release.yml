name: Windows release (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installer
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc --bundles nsis --ci
      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)"
          }
          New-Item -ItemType Directory -Path release | Out-Null
          $name = 'Orbit-Windows-x64-setup.exe'
          Copy-Item $installers[0].FullName "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Verify installer checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="windows-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            release/Orbit-Windows-x64-setup.exe release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Orbit Windows - build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Windows x64 installer built from ${GITHUB_SHA}. Unsigned preview build: Windows SmartScreen may show a warning. WebView2 is installed by the setup program if needed." \
            --prerelease
